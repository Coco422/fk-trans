name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Types and tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Regenerates src/api/types.ts from the Rust structs. A diff means the
      # generated types were not committed alongside the Rust change they came
      # from, which is exactly the drift this codegen exists to prevent.
      # The export tests also write into src/api, so this only works on macOS.
      - name: Generated types are up to date
        run: |
          npm run gen:types
          # `git add` first, then compare against HEAD: a plain `git diff` does
          # not see an untracked file, so it would pass on a fresh checkout even
          # if the generated file had never been committed.
          git add -A -- src/api
          if ! git diff --cached --quiet -- src/api; then
            echo "::error::src/api/types.ts is stale. Run 'npm run gen:types' and commit the result."
            git --no-pager diff --cached -- src/api
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build -- --mode development
