[package]
name = "fk-trans"
version = "0.3.0"
description = "Middle-click driven desktop translation tool"
authors = ["Ray"]
edition = "2021"

[lib]
name = "fk_trans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
objc = "0.2"
# Swizzles a Tauri window into a real NSPanel. Without this the popup is a plain
# NSWindow, and a plain NSWindow activates the app when clicked and swallows the
# first click — see src/macos/window.rs.
tauri-nspanel = "2.1"
core-foundation = "0.10"
core-graphics = "0.24"
log = "0.4"
urlencoding = "2"
dirs = "6"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
ts-rs = "12.0.1"
accessibility-sys = "0.2.0"
core-foundation-sys = "0.8.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
